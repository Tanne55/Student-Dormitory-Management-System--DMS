version: '3.8'
services:
  db:
    image: mysql:8.0
    container_name: qliktx-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-123456}
      MYSQL_DATABASE: ${DB_NAME:-qliktx}
      MYSQL_USER: ${DB_USER:-qliktx}
      MYSQL_PASSWORD: ${DB_PASS:-123456}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
